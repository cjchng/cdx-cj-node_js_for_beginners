<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whispering | Home</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav class="menu">
        <ul>
            <li><a href="/about">About</a></li>
            <li><a href="#">Whispering</a></li>
        </ul>
    </nav>
    <main>
        <form id="whisper-form" class="composer">
            <label for="whisper-message">Spread a whisper</label>
            <textarea id="whisper-message" name="message" rows="4" placeholder="Type your whisper here..." required></textarea>
            <button type="submit" class="block">Share whisper</button>
        </form>
        <div id="whispers"></div>
    </main>
    <script src="app.js"></script>
</body>

</html>
